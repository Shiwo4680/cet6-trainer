<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六级高频词汇选择器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23007AFF'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='26' font-weight='700' text-anchor='middle' fill='%23FFFFFF'%3EC6%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#007aff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="六级词汇训练">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  color-scheme: light;
  --bg:#f2f2f7;
  --panel:rgba(255,255,255,.86);
  --panel-solid:#fff;
  --text:#1c1c1e;
  --muted:#6e6e73;
  --line:rgba(60,60,67,.14);
  --primary:#007aff;
  --primary-dark:#0062cc;
  --success:#34c759;
  --danger:#ff3b30;
  --warn:#ff9500;
  --success-bg:rgba(52,199,89,.13);
  --danger-bg:rgba(255,59,48,.12);
  --warn-bg:rgba(255,149,0,.14);
  --shadow:0 22px 60px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:
  radial-gradient(circle at 18% 10%, rgba(0,122,255,.13), transparent 28%),
  radial-gradient(circle at 86% 8%, rgba(52,199,89,.12), transparent 26%),
  var(--bg)}
button{border:0;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.72}
a{color:inherit}
.app-shell{width:min(980px,calc(100% - 32px));margin:0 auto;padding:34px 0}
.hero{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:end;margin-bottom:18px}
.eyebrow{margin:0 0 8px;color:var(--primary);font-size:13px;font-weight:700}
.control-panel{display:grid;gap:10px;margin-top:18px}
.control-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.control-group span{min-width:34px;color:var(--muted);font-size:13px;font-weight:700}
.control-button{min-height:34px;padding:0 13px;border:1px solid var(--line);border-radius:999px;color:var(--text);background:rgba(255,255,255,.72);font-size:14px;font-weight:700;transition:background .16s ease,border-color .16s ease,color .16s ease,transform .16s ease}
.control-button:hover{border-color:rgba(0,122,255,.36);background:rgba(255,255,255,.94)}
.control-button:active{transform:scale(.97)}
.control-button.active{border-color:var(--primary);color:#fff;background:var(--primary)}
h1,h2,p{margin-top:0}
h1{margin-bottom:0;font-size:36px;line-height:1.14}
.stats{display:grid;grid-template-columns:repeat(5,78px);gap:8px;padding:8px;border:1px solid rgba(255,255,255,.74);border-radius:22px;background:rgba(255,255,255,.55);box-shadow:0 10px 34px rgba(0,0,0,.05);backdrop-filter:blur(18px)}
.stats div{min-height:74px;padding:12px 6px;border-radius:16px;background:rgba(255,255,255,.78);text-align:center}
.stats span{display:block;margin-bottom:3px;font-size:26px;font-weight:760;line-height:1}
.stats small{color:var(--muted);font-size:12px}
.stats .acc{color:var(--primary)}
.stats .streak{color:var(--warn)}
.tabs{display:flex;gap:6px;margin-bottom:18px;padding:5px;width:max-content;border:1px solid rgba(255,255,255,.74);border-radius:999px;background:rgba(255,255,255,.55);backdrop-filter:blur(18px)}
.tab-button{min-height:34px;padding:0 22px;border-radius:999px;color:var(--muted);background:transparent;font-size:14px;font-weight:700;transition:background .16s ease,color .16s ease}
.tab-button:hover{color:var(--text)}
.tab-button.active{color:#fff;background:var(--primary)}
.practice-panel,.wrong-book,.vocab-panel{border:1px solid rgba(255,255,255,.78);border-radius:28px;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(22px)}
.practice-panel{overflow:hidden}
.question-card{padding:34px}
.question-topline,.section-title{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:14px}
.question-topline{align-items:center}
#wordIndex,.pill{display:inline-flex;align-items:center;min-height:28px;padding:0 11px;border-radius:999px;background:rgba(118,118,128,.12)}
#questionText{min-height:90px;margin:24px 0 22px;font-size:48px;font-weight:760;line-height:1.12;text-align:center;overflow-wrap:anywhere}
.question-card.meaning-mode #questionText{font-size:34px;line-height:1.35}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.choice-button{position:relative;min-height:72px;padding:16px 18px 16px 48px;border:1px solid rgba(60,60,67,.1);border-radius:18px;color:var(--text);background:var(--panel-solid);box-shadow:0 8px 22px rgba(0,0,0,.04);text-align:left;line-height:1.45;transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease}
.opt-num{position:absolute;left:16px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:rgba(118,118,128,.12);color:var(--muted);font-size:12px;font-weight:700}
.choice-button:hover{border-color:rgba(0,122,255,.42);background:rgba(255,255,255,.96);box-shadow:0 12px 28px rgba(0,122,255,.12);transform:translateY(-1px)}
.choice-button:active{transform:scale(.985)}
.choice-button.correct{border-color:rgba(52,199,89,.42);color:#16833a;background:var(--success-bg)}
.choice-button.correct .opt-num{color:#16833a}
.choice-button.wrong{border-color:rgba(255,59,48,.42);color:#c12a23;background:var(--danger-bg)}
.feedback{min-height:28px;margin:18px 0 0;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;font-weight:700}
.feedback.correct{color:var(--success)}
.feedback.wrong{color:var(--danger)}
.feedback .fb-msg{display:inline-block}
.speak-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;border:1px solid var(--line);border-radius:50%;color:var(--primary);background:rgba(255,255,255,.85);transition:background .16s ease,border-color .16s ease,transform .16s ease}
.speak-btn:hover{border-color:rgba(0,122,255,.4);background:#fff;transform:scale(1.06)}
.speak-btn:active{transform:scale(.94)}
.speak-btn svg{width:17px;height:17px}
.speak-btn.small{width:26px;height:26px}
.speak-btn.small svg{width:14px;height:14px}
.dict-link{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex:none;border-radius:50%;color:var(--muted);background:rgba(118,118,128,.1);text-decoration:none;transition:background .16s ease,color .16s ease}
.dict-link:hover{color:var(--primary);background:rgba(0,122,255,.12)}
.dict-link svg{width:13px;height:13px}
.actions{display:flex;justify-content:center;gap:12px;margin-top:24px}
.actions button{min-width:116px;min-height:46px;padding:0 18px;border-radius:999px;color:#fff;background:var(--primary);box-shadow:0 10px 22px rgba(0,122,255,.22);font-weight:700;transition:transform .16s ease,background .16s ease,box-shadow .16s ease}
.actions button:hover{background:var(--primary-dark);box-shadow:0 12px 26px rgba(0,122,255,.26)}
.actions button:active{transform:scale(.97)}
.actions .secondary{border:1px solid var(--line);color:var(--primary);background:rgba(255,255,255,.76);box-shadow:none}
.actions .secondary:hover{background:rgba(255,255,255,.95);box-shadow:none}
.wrong-practice-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px;padding:12px 16px;border:1px solid rgba(255,149,0,.4);border-radius:16px;color:#9a5b00;background:var(--warn-bg);font-size:14px;font-weight:700}
.wrong-practice-banner button{flex:none;min-height:32px;padding:0 14px;border-radius:999px;color:#9a5b00;border:1px solid rgba(255,149,0,.45);background:rgba(255,255,255,.7);font-weight:700}
.wrong-practice-banner button:hover{background:#fff}
.wrong-book{margin-top:18px;padding:24px}
.section-title{align-items:center;margin-bottom:14px}
.section-title h2{margin:0;font-size:21px}
.section-title .pill{color:var(--muted)}
.wrong-book-actions{display:flex;align-items:center;gap:8px}
.wrong-book-actions button{min-height:30px;padding:0 12px;border:1px solid var(--line);border-radius:999px;color:var(--primary);background:rgba(255,255,255,.8);font-size:13px;font-weight:700;transition:background .16s ease,border-color .16s ease}
.wrong-book-actions button:hover{border-color:rgba(0,122,255,.4);background:#fff}
.wrong-book-actions button.active{color:#fff;background:var(--primary);border-color:var(--primary)}
#wrongBookList{display:grid;gap:10px;margin:0;padding:0;list-style:none}
#wrongBookList li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.72);line-height:1.5}
#wrongBookList strong{color:var(--primary)}
#wrongBookList .wm{flex:1;min-width:0;color:var(--text);overflow-wrap:anywhere}
.chip{flex:none;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.chip.easy{color:#16833a;background:var(--success-bg)}
.chip.medium{color:#9a5b00;background:var(--warn-bg)}
.chip.hard{color:#c12a23;background:var(--danger-bg)}
.remove-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex:none;border-radius:50%;color:var(--muted);background:rgba(118,118,128,.1);transition:background .16s ease,color .16s ease}
.remove-btn:hover{color:var(--danger);background:var(--danger-bg)}
.remove-btn svg{width:13px;height:13px}
.empty-state{color:var(--muted)}
.hidden{display:none!important}
.vocab-panel{padding:24px}
.vocab-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.search-box{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:0 14px;height:40px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.8)}
.search-box svg{width:16px;height:16px;flex:none;color:var(--muted)}
.search-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:var(--text)}
.search-box input::placeholder{color:var(--muted)}
.vocab-count{flex:none;color:var(--muted);font-size:13px;font-weight:700}
.vocab-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.vocab-list li{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.7);line-height:1.5}
.vocab-list .vw{min-width:120px;font-size:16px;font-weight:760}
.vocab-list .vm{flex:1;min-width:0;overflow-wrap:anywhere}
.shortcut-hint{margin:16px 0 0;color:var(--muted);font-size:12px;text-align:center}
.toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,16px);padding:10px 18px;border-radius:999px;color:#fff;background:rgba(28,28,30,.88);font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:760px){
  .app-shell{width:min(100% - 22px,980px);padding:20px 0}
  .hero{grid-template-columns:1fr;align-items:start}
  h1{font-size:30px}
  .control-panel{margin-top:16px}
  .stats{width:100%;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:6px}
  .stats div{min-height:64px;padding:10px 2px}
  .stats span{font-size:21px}
  .stats small{font-size:11px}
  .tabs{width:100%}
  .tab-button{flex:1;padding:0 10px}
  .question-card{padding:24px 18px 22px}
  #questionText{min-height:72px;margin:20px 0 18px;font-size:38px}
  .question-card.meaning-mode #questionText{font-size:28px}
  .choice-grid{grid-template-columns:1fr;gap:10px}
  .choice-button{min-height:62px}
  .actions{flex-direction:column}
  .actions button{width:100%}
  .wrong-book{padding:20px}
  .section-title{flex-wrap:wrap}
  .wrong-book-actions{width:100%}
  .vocab-panel{padding:20px}
  .vocab-toolbar{flex-wrap:wrap}
  .vocab-count{width:100%;text-align:right}
  .vocab-list .vw{min-width:0;width:38%}
}
</style>
</head>
<body>
<main class="app-shell">
  <section class="hero">
    <div>
      <p class="eyebrow">CET-6 Word Trainer</p>
      <h1>六级高频词汇选择器</h1>
      <div class="control-panel" aria-label="练习设置">
        <div class="control-group" aria-label="模式切换">
          <span>模式</span>
          <button class="control-button active" type="button" data-mode="en-to-zh">英文选中文</button>
          <button class="control-button" type="button" data-mode="zh-to-en">中文选英文</button>
        </div>
        <div class="control-group" aria-label="难度筛选">
          <span>难度</span>
          <button class="control-button active" type="button" data-difficulty="all">全部</button>
          <button class="control-button" type="button" data-difficulty="easy">基础</button>
          <button class="control-button" type="button" data-difficulty="medium">进阶</button>
          <button class="control-button" type="button" data-difficulty="hard">困难</button>
        </div>
      </div>
    </div>
    <div class="stats" aria-label="答题统计">
      <div><span id="totalCount">0</span><small>总题数</small></div>
      <div><span id="correctCount">0</span><small>正确</small></div>
      <div><span id="wrongCount">0</span><small>错误</small></div>
      <div><span id="accuracyRate" class="acc">—</span><small>正确率</small></div>
      <div><span id="streakCount" class="streak">0</span><small>连对</small></div>
    </div>
  </section>

  <nav class="tabs" aria-label="功能切换">
    <button class="tab-button active" type="button" data-tab="practice">练习</button>
    <button class="tab-button" type="button" data-tab="vocab">词汇表</button>
  </nav>

  <section id="practiceView" aria-label="练习区">
    <section class="practice-panel">
      <div class="question-card">
        <div id="wrongPracticeBanner" class="wrong-practice-banner hidden">
          <span>错题重练中 · 答对自动移出错题本</span>
          <button id="exitWrongPractice" type="button">退出</button>
        </div>
        <div class="question-topline">
          <span id="wordIndex">第 1 题</span>
          <button id="speakQuestion" class="speak-btn" type="button" aria-label="播放发音" title="播放发音"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
        </div>
        <h2 id="questionText">正在加载题目...</h2>
        <div id="choiceArea" class="choice-grid" aria-label="答案选项"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
        <div class="actions">
          <button id="nextQuestion" type="button">下一题</button>
          <button id="resetPractice" class="secondary" type="button">重新开始</button>
        </div>
      </div>
    </section>

    <section class="wrong-book" aria-label="错题本">
      <div class="section-title">
        <h2>错题本</h2>
        <div class="wrong-book-actions">
          <button id="practiceWrongBtn" type="button">重练错题</button>
          <button id="clearWrongBtn" type="button">清空</button>
          <span id="wrongBookCount" class="pill">0 个</span>
        </div>
      </div>
      <ul id="wrongBookList"><li class="empty-state">答错的词会自动记录在这里。</li></ul>
    </section>
  </section>

  <section id="vocabView" class="vocab-panel hidden" aria-label="词汇表">
    <div class="vocab-toolbar">
      <div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="vocabSearch" type="search" placeholder="搜索单词或释义…" aria-label="搜索词汇"></div>
      <span id="vocabCount" class="vocab-count">0 词</span>
    </div>
    <ul id="vocabList" class="vocab-list"></ul>
  </section>

  <p class="shortcut-hint">快捷键：1–4 选答案 · Enter 下一题 · R 重新开始</p>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  "use strict";

    toast: document.getElementById("toast")
  };

  var savedStats = loadLS(LS_STATS, { total: 0, correct: 0, wrong: 0, streak: 0 });
  var savedSet = loadLS(LS_SET, {});
  var state = {
    mode: savedSet.mode === "zh-to-en" ? "zh-to-en" : "en-to-zh",
    difficulty: ["all", "easy", "medium", "hard"].indexOf(savedSet.difficulty) > -1 ? savedSet.difficulty : "all",
    tab: "practice",
    currentWord: null,
    answered: false,
    total: savedStats.total || 0,
    correct: savedStats.correct || 0,
    wrong: savedStats.wrong || 0,
    streak: savedStats.streak || 0,
    wrongBook: loadLS(LS_WRONG, []),
    wrongPractice: false,
    search: "",
    autoNextTimer: null,
    vocabLimit: 80,
    vocabRendered: 0
  };

  function speak(text) {
    if (!("speechSynthesis" in window) || !text) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.9;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  var toastTimer = null;
  function toast(msg) {
    elements.toast.textContent = msg;
    elements.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { elements.toast.classList.remove("show"); }, 2000);
  }

  function getActiveWords() {
    if (state.difficulty === "all") return WORDS;
    return WORDS.filter(function (item) { return item.difficulty === state.difficulty; });
  }

  function shuffle(items) {
    var result = items.slice();
    for (var i = result.length - 1; i > 0; i -= 1) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = result[i]; result[i] = result[j]; result[j] = t;
    }
    return result;
  }

  function pickRandomFrom(pool) {
    if (pool.length > 1 && state.currentWord) {
      var candidates = pool.filter(function (w) { return w.word !== state.currentWord.word; });
      return candidates[Math.floor(Math.random() * candidates.length)];
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function getChoiceOptions(targetWord) {
    var pool = state.wrongPractice ? state.wrongBook : getActiveWords();
    var source = pool.length >= 4 ? pool : WORDS;
    var distractors = shuffle(source.filter(function (item) { return item.word !== targetWord.word; })).slice(0, 3);
    return shuffle([targetWord].concat(distractors));
  }

  function getQuestionText(word) {
    return state.mode === "zh-to-en" ? word.meaning : word.word;
  }
  function getOptionText(word) {
    return state.mode === "zh-to-en" ? word.word : word.meaning;
  }

  function updateStats() {
    elements.totalCount.textContent = state.total;
    elements.correctCount.textContent = state.correct;
    elements.wrongCount.textContent = state.wrong;
    elements.streakCount.textContent = state.streak;
    elements.accuracyRate.textContent = state.total > 0 ? Math.round((state.correct / state.total) * 100) + "%" : "—";
  }
  function saveStats() {
    saveLS(LS_STATS, { total: state.total, correct: state.correct, wrong: state.wrong, streak: state.streak });
  }
  function saveSettings() {
    saveLS(LS_SET, { mode: state.mode, difficulty: state.difficulty });
  }

  function updateControls() {
    document.querySelectorAll("[data-mode]").forEach(function (b) {
      b.classList.toggle("active", b.dataset.mode === state.mode);
    });
    document.querySelectorAll("[data-difficulty]").forEach(function (b) {
      b.classList.toggle("active", b.dataset.difficulty === state.difficulty);
    });
    document.querySelectorAll(".tab-button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.tab === state.tab);
    });
    elements.questionCard.classList.toggle("meaning-mode", state.mode === "zh-to-en");
    elements.practiceView.classList.toggle("hidden", state.tab !== "practice");
    elements.vocabView.classList.toggle("hidden", state.tab !== "vocab");
    elements.wrongPracticeBanner.classList.toggle("hidden", !state.wrongPractice);
    elements.practiceWrongBtn.classList.toggle("active", state.wrongPractice);
  }

  function renderFeedback(msg, type, word) {
    elements.feedback.className = "feedback " + (type || "");
    if (word) {
      elements.feedback.innerHTML = '<span class="fb-msg"></span><button type="button" class="speak-btn" data-word="' + word + '" aria-label="播放发音" title="播放发音">' + SPEAK_SVG + '</button>';
    } else {
      elements.feedback.innerHTML = '<span class="fb-msg"></span>';
    }
    elements.feedback.querySelector(".fb-msg").textContent = msg;
  }

  function addWrongWord(word) {
    var exists = state.wrongBook.some(function (item) { return item.word === word.word; });
    if (!exists) state.wrongBook.push({ word: word.word, meaning: word.meaning, difficulty: word.difficulty });
    renderWrongBook();
  }
  function removeWrongWord(word) {
    state.wrongBook = state.wrongBook.filter(function (item) { return item.word !== word; });
    renderWrongBook();
  }

  function renderWrongBook() {
    elements.wrongBookCount.textContent = state.wrongBook.length + " 个";
    if (state.wrongBook.length === 0) {
      elements.wrongBookList.innerHTML = '<li class="empty-state">答错的词会自动记录在这里。</li>';
      return;
    }
    elements.wrongBookList.innerHTML = state.wrongBook.map(function (item) {
      return '<li>' +
        '<button type="button" class="speak-btn small" data-word="' + item.word + '" aria-label="播放发音" title="播放发音">' + SPEAK_SVG + '</button>' +
        '<strong>' + item.word + '</strong>' +
        '<span class="wm">' + item.meaning + '</span>' +
        '<span class="chip ' + item.difficulty + '">' + DIFF_LABEL[item.difficulty] + '</span>' +
        '<a class="dict-link" href="' + dictUrl(item.word) + '" target="_blank" rel="noopener" aria-label="打开词典" title="查词典">' + DICT_SVG + '</a>' +
        '<button type="button" class="remove-btn" data-remove="' + item.word + '" aria-label="移出错题本" title="移出">' + CLOSE_SVG + '</button>' +
        '</li>';
    }).join("");
    saveLS(LS_WRONG, state.wrongBook);
  }

  var VOCAB_BATCH = 80;
  var vocabFiltered = [];
  function vocabItemHtml(w) {
    return '<li>' +
      '<button type="button" class="speak-btn small" data-word="' + w.word + '" aria-label="播放发音" title="播放发音">' + SPEAK_SVG + '</button>' +
      '<span class="vw">' + w.word + '</span>' +
      '<span class="vm">' + w.meaning + '</span>' +
      '<span class="chip ' + w.difficulty + '">' + DIFF_LABEL[w.difficulty] + '</span>' +
      '<a class="dict-link" href="' + dictUrl(w.word) + '" target="_blank" rel="noopener" aria-label="打开词典" title="查词典">' + DICT_SVG + '</a>' +
      '</li>';
  }
  function renderVocab() {
    var q = state.search.trim().toLowerCase();
    vocabFiltered = WORDS.filter(function (w) {
      if (state.difficulty !== "all" && w.difficulty !== state.difficulty) return false;
      if (q && w.word.toLowerCase().indexOf(q) === -1 && w.meaning.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    elements.vocabCount.textContent = vocabFiltered.length + " 词";
    if (vocabFiltered.length === 0) {
      elements.vocabList.innerHTML = '<li class="empty-state">未找到匹配的单词。</li>';
      state.vocabRendered = 0;
      return;
    }
    state.vocabLimit = VOCAB_BATCH;
    var shown = vocabFiltered.slice(0, state.vocabLimit);
    elements.vocabList.innerHTML = shown.map(vocabItemHtml).join("");
    state.vocabRendered = shown.length;
  }
  function appendVocabBatch() {
    if (state.tab !== "vocab") return;
    if (state.vocabRendered >= vocabFiltered.length) return;
    var more = vocabFiltered.slice(state.vocabRendered, state.vocabRendered + VOCAB_BATCH);
    if (more.length === 0) return;
    elements.vocabList.insertAdjacentHTML("beforeend", more.map(vocabItemHtml).join(""));
    state.vocabRendered += more.length;
  }

  function clearAutoNextTimer() {
    if (state.autoNextTimer) {
      window.clearTimeout(state.autoNextTimer);
      state.autoNextTimer = null;
    }
  }
  function scheduleAutoNext() {
    clearAutoNextTimer();
    state.autoNextTimer = window.setTimeout(renderQuestion, AUTO_NEXT_DELAY);
  }
  function lockChoiceButtons() {
    state.answered = true;
    elements.choiceArea.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
  }

  function judgeAnswer(option, selectedButton) {
    if (state.answered) return;
    var isCorrect = option.word === state.currentWord.word;
    var word = state.currentWord;
    state.total += 1;

    if (isCorrect) {
      state.correct += 1;
      state.streak += 1;
      if (state.wrongPractice) removeWrongWord(word.word);
      renderFeedback("回答正确，即将进入下一题。", "correct", state.mode === "zh-to-en" ? word.word : null);
    } else {
      state.wrong += 1;
      state.streak = 0;
      if (!state.wrongPractice) addWrongWord(word);
      renderFeedback("回答错误，正确答案：" + word.word + "（" + word.meaning + "）", "wrong", word.word);
    }

    selectedButton.classList.add(isCorrect ? "correct" : "wrong");
    elements.choiceArea.querySelectorAll("button").forEach(function (b) {
      if (b.dataset.word === word.word) b.classList.add("correct");
    });

    lockChoiceButtons();
    updateStats();
    saveStats();
    if (isCorrect) scheduleAutoNext();
  }

  function renderQuestion() {
    clearAutoNextTimer();
    var activeWords = getActiveWords();
    if (activeWords.length === 0) {
      elements.questionText.textContent = "当前难度暂无词条";
      elements.choiceArea.innerHTML = "";
      renderFeedback("请切换到其他难度。", "wrong");
      return;
    }
    if (state.wrongPractice) {
      if (state.wrongBook.length === 0) {
        state.wrongPractice = false;
        updateControls();
        toast("错题本已清空，全部掌握！");
        renderQuestion();
        return;
      }
      state.currentWord = pickRandomFrom(state.wrongBook);
    } else {
      state.currentWord = pickRandomFrom(activeWords);
    }
    state.answered = false;

    elements.questionText.textContent = getQuestionText(state.currentWord);
    elements.wordIndex.textContent = "第 " + (state.total + 1) + " 题";
    elements.choiceArea.innerHTML = "";
    renderFeedback("", "");
    updateControls();
    updateStats();

    getChoiceOptions(state.currentWord).forEach(function (option, idx) {
      var button = document.createElement("button");
      button.type = "button";
      button.className = "choice-button";
      button.dataset.word = option.word;
      button.innerHTML = '<span class="opt-num">' + (idx + 1) + '</span>' + getOptionText(option);
      button.addEventListener("click", function () { judgeAnswer(option, button); });
      elements.choiceArea.appendChild(button);
    });
  }

  function exitWrongPractice() {
    if (!state.wrongPractice) return;
    state.wrongPractice = false;
    updateControls();
    renderQuestion();
  }

  function startWrongPractice() {
    if (state.wrongBook.length === 0) {
      toast("错题本是空的，先去练习吧");
      return;
    }
    state.wrongPractice = true;
    state.answered = false;
    updateControls();
    renderQuestion();
  }

  function resetPractice() {
    var hasData = state.total > 0 || state.wrongBook.length > 0;
    if (hasData && !window.confirm("重新开始会清空本轮统计和错题本，确定吗？")) return;
    state.currentWord = null;
    state.answered = false;
    state.total = 0;
    state.correct = 0;
    state.wrong = 0;
    state.streak = 0;
    state.wrongBook = [];
    state.wrongPractice = false;
    saveStats();
    saveLS(LS_WRONG, []);
    renderWrongBook();
    updateControls();
    renderQuestion();
  }

  function setMode(mode) {
    if (state.mode === mode) return;
    state.mode = mode;
    state.wrongPractice = false;
    saveSettings();
    renderQuestion();
    updateControls();
  }
  function setDifficulty(difficulty) {
    if (state.difficulty === difficulty) return;
    state.difficulty = difficulty;
    state.wrongPractice = false;
    saveSettings();
    renderQuestion();
    updateControls();
    if (state.tab === "vocab") renderVocab();
  }
  function setTab(tab) {
    state.tab = tab;
    updateControls();
    if (tab === "vocab") renderVocab();
  }

  document.querySelectorAll("[data-mode]").forEach(function (b) {
    b.addEventListener("click", function () { setMode(b.dataset.mode); });
  });
  document.querySelectorAll("[data-difficulty]").forEach(function (b) {
    b.addEventListener("click", function () { setDifficulty(b.dataset.difficulty); });
  });
  document.querySelectorAll(".tab-button").forEach(function (b) {
    b.addEventListener("click", function () { setTab(b.dataset.tab); });
  });
  elements.nextQuestion.addEventListener("click", renderQuestion);
  elements.resetPractice.addEventListener("click", resetPractice);
  elements.speakQuestion.addEventListener("click", function () {
    if (state.currentWord) speak(state.currentWord.word);
  });
  elements.practiceWrongBtn.addEventListener("click", startWrongPractice);
  elements.clearWrongBtn.addEventListener("click", function () {
    if (state.wrongBook.length === 0) {
      toast("错题本是空的");
      return;
    }
    if (!window.confirm("确定清空错题本吗？")) return;
    state.wrongBook = [];
    state.wrongPractice = false;
    saveLS(LS_WRONG, []);
    renderWrongBook();
    updateControls();
    renderQuestion();
  });
  elements.exitWrongPractice.addEventListener("click", exitWrongPractice);
  elements.vocabSearch.addEventListener("input", function () {
    state.search = elements.vocabSearch.value;
    renderVocab();
  });
  var scrollTicking = false;
  window.addEventListener("scroll", function () {
    if (scrollTicking) return;
    scrollTicking = true;
    window.requestAnimationFrame(function () {
      scrollTicking = false;
      if (state.tab !== "vocab") return;
      var doc = document.documentElement;
      if (doc.scrollTop + window.innerHeight >= doc.scrollHeight - 500) appendVocabBatch();
    });
  }, { passive: true });

  document.addEventListener("click", function (e) {
    var speakBtn = e.target.closest ? e.target.closest(".speak-btn") : null;
    if (speakBtn && speakBtn.dataset.word) {
      speak(speakBtn.dataset.word);
      return;
    }
    var removeBtn = e.target.closest ? e.target.closest("[data-remove]") : null;
    if (removeBtn) {
      var w = removeBtn.dataset.remove;
      removeWrongWord(w);
      if (state.wrongPractice && state.wrongBook.length === 0) {
        state.wrongPractice = false;
        updateControls();
        renderQuestion();
      }
      toast("已从错题本移出：" + w);
    }
  });

  document.addEventListener("keydown", function (e) {
    var tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (state.tab !== "practice") return;
    if (e.key >= "1" && e.key <= "4") {
      var btns = elements.choiceArea.querySelectorAll("button:not([disabled])");
      var idx = parseInt(e.key, 10) - 1;
      if (btns[idx]) btns[idx].click();
    } else if (e.key === "Enter") {
      if (state.answered) elements.nextQuestion.click();
    } else if (e.key === "r" || e.key === "R") {
      elements.resetPractice.click();
    }
  });

  updateControls();
  updateStats();
  renderWrongBook();
  renderVocab();
  renderQuestion();
})();
</script>

/* PWA：注册 Service Worker（需要 http/https 环境，file:// 下自动跳过） */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
